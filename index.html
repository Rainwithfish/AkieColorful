                        const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank;
                        const isMe = currentUser && u.qq === currentUser.qq;
                        return '<li class="rank-row' + (isMe ? ' me' : '') + '">' +
                            '<span class="rank-no">' + medal + '</span>' +
                            '<img class="rank-avatar" src="' + escapeHtml(u.avatar) + '" alt="" ' +
                            'onerror="this.onerror=null;this.src=\'' + getAvatarUrl(u.qq) + '\'">' +
                            '<span class="rank-name">' + escapeHtml(u.nickname) + (isMe ? ' <b>(我)</b>' : '') + '</span>' +
                            '<span class="rank-score">' + u.best + '</span>' +
                            '</li>';
                    }).join('');
                } catch (err) {
                    console.error('排行榜加载失败:', err);
                    rankList.innerHTML = '<li class="rank-empty">加载失败，请稍后重试</li>';
                }
            }

            function openRank() {
                rankModal.classList.add('visible');
                renderRank();
            }
            function closeRank() {
                rankModal.classList.remove('visible');
            }

            rankBtn.addEventListener('click', openRank);
            rankClose.addEventListener('click', closeRank);
            rankRefresh.addEventListener('click', renderRank);
            rankPlay.addEventListener('click', closeRank);
            rankModal.addEventListener('click', e => {
                if (e.target === rankModal) closeRank();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeRank();
            });

            /* ---------- 游戏结束后提交分数（走服务端） ---------- */
            window.addEventListener('game:over', async (e) => {
                const detail = e.detail || {};
                if (!currentUser) {
                    showToast('登录后成绩可上榜 🏅');
                    return;
                }
                if (!detail.score || detail.score <= 0) return;

                try {
                    const res = await fetch(API_SCORE, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            qq: currentUser.qq,
                            nickname: currentUser.nickname,
                            avatar: currentUser.avatar,
                            score: detail.score,
                            maxCombo: detail.maxCombo || 0,
                        })
                    });
                    const data = await res.json();
                    if (!res.ok || !data.ok) {
                        console.warn('分数提交失败:', data);
                        return;
                    }
                    if (data.isNewBest) {
                        showToast('🎉 新纪录 ' + data.best + ' 分，当前第 ' + data.rank + ' 名');
                        if (data.best > (currentUser.best || 0)) {
                            currentUser.best = data.best;
                            saveUser();
                            renderUser();
                        }
                    }
                } catch (err) {
                    console.warn('分数提交失败:', err);
                    showToast('分数上传失败，请检查网络');
                }
            });

            /* ---------- 对外暴露 ---------- */
            window.__qqUser = {
                isLoggedIn: () => !!currentUser,
                get: () => currentUser,
                openLogin: openLogin,
                closeLogin: closeLogin,
                requireLogin: () => {
                    if (currentUser) return true;
                    window.__pendingStart = true;
                    showToast('请先输入 QQ 号登录再开始游戏 🐧');
                    openLogin();
                    return false;
                }
            };

            /* ---------- 初始化 ---------- */
            loadUser();

            // ⭐ 页面加载后，若未登录，立即弹出 QQ 登录提示（第一个弹窗）
            if (!currentUser) {
                setTimeout(() => openLogin(), 350);
            }
        })();
    </script>

</body>
</html>
